[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xagent-sdk"
version = "0.1.0"
description = "Python client SDK for xAgent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Xagent Source License" }
authors = [
    { name = "Alex Liu" },
]
keywords = ["xagent", "agent", "sdk", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/xorbitsai/xagent-sdk-python"
Repository = "https://github.com/xorbitsai/xagent-sdk-python"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.12.3",
    "mypy>=1.19.0",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xagent_sdk"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PT"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
